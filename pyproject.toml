[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codehound"
version = "0.1.0"
description = "Hunts down git repos and stray software projects across your disks; tray dashboard to find, launch, and organise them."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
codehound = "codehound.cli:main"

[tool.setuptools.packages.find]
include = ["codehound*"]

[tool.setuptools.package-data]
codehound = ["assets/*.svg"]
