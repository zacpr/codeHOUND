[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codehound"
version = "0.3.0"
description = "Hunts down git repos and stray software projects across your disks; tray dashboard to find, launch, and organise them."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "zacpr", email = "zac@ashurtech.net"},
]
keywords = ["git", "projects", "scanner", "dashboard", "tray", "ollama", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.urls]
Homepage = "https://github.com/zacpr/codeHOUND"
Repository = "https://github.com/zacpr/codeHOUND"
Issues = "https://github.com/zacpr/codeHOUND/issues"

[project.scripts]
codehound = "codehound.cli:main"

[tool.setuptools.packages.find]
include = ["codehound*"]

[tool.setuptools.package-data]
codehound = ["assets/*.png", "assets/*.desktop", "assets/icons/*/apps/*.png"]
